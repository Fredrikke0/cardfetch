[package]
name = "cardfetch"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
indicatif = "0.17"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "blocking", "cookies"] }
wreq = { version = "6.0.0-rc.29", default-features = false, features = ["tokio-rt", "cookies", "json", "form"] }
wreq-util = "3.0.0-rc"
tokio = { version = "1", features = ["rt-multi-thread"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
base64 = "0.22"
